# Save at: infra/nginx/nginx.conf
#
# Round-robins /plan across scaled motion-planner replicas.
# Compose service is named "motion-planner" — docker's built-in DNS
# resolves it to all replica IPs, so upstream "motion-planner:8020"
# gets one IP per scale=N instance.

events {}

http {
    upstream planners {
        server motion-planner:8020;
    }

    server {
        listen 8020;

        location /plan {
            proxy_pass http://planners/plan;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location /health {
            proxy_pass http://planners/health;
        }
    }
}
