# Save at: .github/workflows/ci.yml

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff
      - name: Ruff
        run: ruff check services tests

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install service deps
        run: |
          pip install -r services/nl_command/requirements.txt
          pip install -r services/motion_planner/requirements.txt
          pip install -r services/dispatcher/requirements.txt
          pip install -r services/actuation/requirements.txt
          pip install -r services/telemetry/requirements.txt
          pip install pytest pytest-asyncio respx httpx
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      mosquitto:
        image: eclipse-mosquitto:2
        ports: ["1883:1883"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r services/nl_command/requirements.txt
          pip install -r services/motion_planner/requirements.txt
          pip install -r services/dispatcher/requirements.txt
          pip install -r services/actuation/requirements.txt
          pip install -r services/telemetry/requirements.txt
          pip install pytest pytest-asyncio respx httpx testcontainers paho-mqtt psycopg[binary] redis
      - name: Apply Timescale init.sql
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d robot -f infra/timescaledb/init.sql
      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          PG_DSN: postgres://postgres:postgres@localhost:5432/robot
          REDIS_URL: redis://localhost:6379/0
          MQTT_HOST: localhost
          MQTT_PORT: "1883"
        run: pytest tests/integration -v

  regression:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r services/motion_planner/requirements.txt
          pip install pytest httpx
      - name: Run regression suite (golden IK cases)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/regression -v